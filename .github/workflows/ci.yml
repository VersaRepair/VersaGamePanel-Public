name: Tests and security checks

on:
  pull_request:
    paths:
      - '**.js'
      - '**.cjs'
      - package*.json
      - '.github/**'
      - '.semgrep.yml'
      - 'ci/**'
      - 'deploy/**'
      - 'runtimes/**'
      - 'Dockerfile*'
      - 'compose.yaml'
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.cjs'
      - package*.json
      - '.github/**'
      - '.semgrep.yml'
      - 'ci/**'
      - 'deploy/**'
      - 'runtimes/**'
      - 'Dockerfile*'
      - 'compose.yaml'
  workflow_dispatch:
    inputs:
      minecraft:
        description: Run the heavier disposable Minecraft journey
        type: boolean
        default: false
      accept_minecraft_eula:
        description: Accept https://www.minecraft.net/en-us/eula for this disposable test
        type: boolean
        default: false
      dedicated_games:
        description: Build reviewed runtimes and run Unturned, Terraria and tModLoader/ExampleMod journeys (large downloads)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Syntax and regression tests (including real Docker TTY/non-TTY)
        env:
          GAMEPANEL_DOCKER_TEST: '1'
        run: |
          command -v docker zip unzip tar
          docker pull alpine:latest
          npm run check
          npm test
      - name: Chromium desktop/mobile browser workflow
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Download pinned secret scanner and verify checksum
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Redacted secret scan of Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/security-requirements.txt
      - name: Install pinned open-source static analyzer
        run: python -m pip install --disable-pip-version-check -r ci/security-requirements.txt
      - name: Local code-security guardrails (no cloud login or source upload)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: semgrep scan --config .semgrep.yml --metrics=off --error server.js lib public/app.js runtimes

  container:
    needs: checks
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write

  dedicated-games:
    if: github.event_name == 'workflow_dispatch' && inputs.dedicated_games
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Build non-root foreground game runtimes
        run: |
          docker build -f runtimes/Unturned.Dockerfile -t versagamepanel/unturned:2 .
          docker build -f runtimes/Terraria.Dockerfile -t versagamepanel/terraria:1.4.5.8-1 .
          docker build -f runtimes/TModLoader.Dockerfile -t versagamepanel/tmodloader:2026.08.3.0-2 .
      - name: Download publisher ExampleMod fixture and verify release digest
        run: |
          curl -fL --retry 3 https://github.com/tModLoader/tModLoader/releases/download/v2026.08.3.0/ExampleMod.zip -o "$RUNNER_TEMP/examplemod.zip"
          echo "6e4bae85dd394724104b5d2e60eba8565762131c037617adf884d128c9f836fc  $RUNNER_TEMP/examplemod.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/examplemod.zip" ExampleMod.tmod -d "$RUNNER_TEMP/examplemod"
      - name: Sequential real-game lifecycle and save restoration tests
        env:
          GAMEPANEL_UNTURNED_TEST: '1'
          GAMEPANEL_UNTURNED_WORKSHOP_TEST: '1'
          GAMEPANEL_TERRARIA_TEST: '1'
          GAMEPANEL_TMODLOADER_TEST: '1'
          GAMEPANEL_TEST_EXAMPLEMOD_FILE: ${{ runner.temp }}/examplemod/ExampleMod.tmod
        run: node --test test/dedicated-journey.test.js

  minecraft:
    if: github.event_name == 'workflow_dispatch' && inputs.minecraft && inputs.accept_minecraft_eula
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Pull the deliberately pinned test image
        run: docker pull itzg/minecraft-server@sha256:627e5d0163f76428c48cc09b0994651474870e90653715376884be5239b88f78
      - name: Full disposable Minecraft journey
        env:
          GAMEPANEL_MINECRAFT_TEST: '1'
          GAMEPANEL_MINECRAFT_MOD_TEST: '1'
          GAMEPANEL_ACCEPT_MINECRAFT_EULA: '1'
        run: node --test --test-concurrency=1 test/minecraft-journey.test.js test/minecraft-mods-journey.test.js
