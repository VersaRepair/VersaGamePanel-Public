name: Tester container
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Validate Compose and build Linux amd64 tester image
        run: |
          docker compose config --quiet
          docker build --pull --build-arg VCS_REF="$GITHUB_SHA" -t versagamepanel/panel:container-test .
          docker pull alpine:latest
      - name: Prove containerized panel manages sibling containers and preserves data
        env:
          GAMEPANEL_CONTAINER_TEST: '1'
        run: node --test test/container-install.test.js
      - name: Download pinned image scanner
        run: |
          curl -fLsS --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tgz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: Block fixable high and critical image vulnerabilities
        run: '"$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 versagamepanel/panel:container-test'
      - name: Save tested image for publisher
        if: github.repository == 'VersaRepair/VersaGamePanel-Public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save versagamepanel/panel:container-test | gzip > panel-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'VersaRepair/VersaGamePanel-Public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-panel-image
          path: panel-image.tar.gz
          retention-days: 1
  publish:
    if: github.repository == 'VersaRepair/VersaGamePanel-Public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-panel-image
      - name: Publish the tested image, never a separate rebuild
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -dc panel-image.tar.gz | docker load
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Publish a commit-specific candidate. Release channels are promoted
          # only by the separately approved workflow_dispatch action.
          docker tag versagamepanel/panel:container-test ghcr.io/versarepair/versagamepanel:sha-$GITHUB_SHA
          docker push ghcr.io/versarepair/versagamepanel:sha-$GITHUB_SHA
          docker logout ghcr.io
